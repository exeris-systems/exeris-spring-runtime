# Behaviour tests for this repository's roles — agents-md-schema.md rule 14.
#
# Runtime-independent on purpose: a case names a fixture, a prompt, the schema the answer must
# conform to, and assertions over its fields. Every grader is deterministic — equality on a field.
#
# Three of these cases assert a REFUSAL to escalate, and they carry the `negative` tag so the count is
# derivable rather than remembered — `--tags negative` selects exactly them.
#
# Three of the 3 are one half of a PAIR, and the pairing is the point: the same construct is a
# defect or ordinary depending on whose shape it describes or where it sits.
#
#   The Wall                Spring type in kernel SPI -> BLOCKED | canonical web bridge in runtime -> PASS
#   Mode Discipline         compat leak in pure mode -> BLOCKED | isolated @CompatibilityMode handler -> PASS
#   Hot-Path zero-copy      LoanedBuffer copy to byte[] -> BLOCKED | direct MemorySegment slice -> PASS
#
version: 1

defaults:
  schema_dir: ../schemas
  fixture_dir: fixtures

cases:
  - id: wall-reject-spring-in-kernel
    agent: exeris-spring-runtime-architect
    fixture: wall-spring-in-kernel.java
    prompt: "Review this proposed change."
    expect:
      schema: verdict.schema.json
      fields:
        decision: BLOCKED
        scope_class: spring-runtime
    tags: [wall, architect]

  - id: wall-permit-canonical-bridge
    agent: exeris-spring-runtime-architect
    fixture: wall-canonical-bridge.java
    prompt: "Review this proposed change."
    expect:
      schema: verdict.schema.json
      fields:
        decision: PASS
        scope_class: spring-runtime
    tags: [wall, architect, negative]

  - id: mode-reject-compat-leak-in-pure
    agent: exeris-spring-runtime-architect
    fixture: mode-compat-leak-in-pure.java
    prompt: "Review this proposed change."
    expect:
      schema: verdict.schema.json
      fields:
        decision: BLOCKED
        scope_class: spring-runtime
    tags: [mode, architect]

  - id: mode-permit-isolated-compat-handler
    agent: exeris-spring-runtime-architect
    fixture: mode-isolated-compat-handler.java
    prompt: "Review this proposed change."
    expect:
      schema: verdict.schema.json
      fields:
        decision: PASS
        scope_class: spring-runtime
    tags: [mode, architect, negative]

  - id: hotpath-reject-loaned-buffer-copy
    agent: exeris-spring-runtime-performance
    fixture: hotpath-loaned-buffer-copy.java
    prompt: "Review this proposed change."
    expect:
      schema: verdict.schema.json
      fields:
        decision: BLOCKED
        scope_class: spring-runtime
    tags: [hotpath, performance]

  - id: hotpath-permit-zero-copy-segment
    agent: exeris-spring-runtime-performance
    fixture: hotpath-zero-copy-segment.java
    prompt: "Review this proposed change."
    expect:
      schema: verdict.schema.json
      fields:
        decision: PASS
        scope_class: spring-runtime
    tags: [hotpath, performance, negative]
