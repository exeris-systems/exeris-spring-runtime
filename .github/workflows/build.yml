name: build

# Quality gate: builds and tests every PR (and every push to main) BEFORE merge.
# This is the missing pre-merge counterpart to deploy.yml — deploy.yml only runs
# `clean deploy` AFTER a commit lands on main, so until now nothing exercised the
# reactor on the PR itself. `mvn verify` runs unit + module-integration +
# runtime-integration tests AND the architecture guard suite (WallIntegrityTest,
# ModuleBoundaryTest, *ClasspathGuardTest, CompatibilityIsolationGuardTest), so a PR
# that breaks The Wall, a module boundary, pure-mode classpath purity, or compat
# isolation fails here instead of on main.
#
# -Pcoverage additionally attaches the JaCoCo agent and enforces a per-module LINE
# coverage floor (each module's ${jacoco.line.minimum}). The floors are a ratchet
# toward the ~0.85 1.0-GA target — a PR that drops a module below its floor fails
# here. Mirrors the exeris-kernel coverage profile.
#
# No paths-ignore filter: a quality gate intended for branch protection must always
# report a conclusion. Skipping via paths-ignore leaves a required check "pending"
# forever and blocks otherwise-mergeable PRs (e.g. docs-only changes).
#
# Required repo secrets (same as deploy.yml):
#   GITHUB_TOKEN         — provided automatically; reads this repo's own packages.
#   PACKAGES_READ_TOKEN  — PAT (classic) with read:packages; needed because the
#                          default GITHUB_TOKEN cannot read exeris-kernel snapshots
#                          from a different repository.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (newer push to a PR branch wins).
# Never cancel main builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  packages: read

jobs:
  verify:
    name: mvn verify (JDK 25 LTS, ${{ matrix.spring-boot-line }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # ADR-028 obligation 2: both Spring Boot lines build and test on every push, and a failure on
    # either blocks merge. fail-fast is off so a break on one line still reports the other — knowing
    # whether a change broke SB4 only or both is most of the diagnosis.
    strategy:
      fail-fast: false
      matrix:
        spring-boot-line: [sb3, sb4]

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PACKAGES_READ_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
      MAVEN_OPTS: '-Xmx2g'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25 (LTS baseline)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verify settings token wiring
        run: |
          if [ -z "${PACKAGES_READ_TOKEN}" ]; then
            echo "::error::PACKAGES_READ_TOKEN secret is not set. Create a PAT (classic) with read:packages scope and add it as a repository secret."
            exit 1
          fi

      - name: Build, test, architecture guards & coverage gate (mvn verify)
        run: >
          mvn -B -ntp -s .github/maven-settings.xml
          -Pmatrix-${{ matrix.spring-boot-line }},coverage
          clean verify

      # The JDK baseline and the absence of preview stamps are properties of the bytecode we
      # publish, so they are checked on the bytecode rather than inferred from the compiler
      # configuration. A source grep or a pom property cannot see a preview stamp that arrives
      # through generated code, a shaded dependency, or a kernel pin that moves back onto a
      # preview-compiled release — and the stamp is what a consumer trips over: preview class
      # files are major-pinned and refuse to load on any other JDK even with the flag. Kernel
      # ADR-066 learned this the expensive way; this is the same check on our side of the wall.
      #
      # Jars rather than target/classes, because the jar is the distributed surface.
      - name: Class-file baseline gate (major 69, no preview stamp)
        run: |
          python3 - <<'EOF'
          import pathlib, sys, zipfile

          EXPECTED_MAJOR = 69   # JDK 25 — must track maven.compiler.release in the root pom
          bad, scanned, jars = [], 0, 0

          for jar in sorted(pathlib.Path('.').glob('*/target/*.jar')):
              if jar.name.endswith(('-sources.jar', '-javadoc.jar')):
                  continue
              jars += 1
              with zipfile.ZipFile(jar) as z:
                  for entry in z.namelist():
                      if not entry.endswith('.class'):
                          continue
                      head = z.read(entry)[:8]
                      minor = int.from_bytes(head[4:6], 'big')
                      major = int.from_bytes(head[6:8], 'big')
                      scanned += 1
                      if major != EXPECTED_MAJOR or minor != 0:
                          bad.append(f"{jar}!{entry}: major={major} minor={minor}")

          if jars == 0:
              sys.exit("::error::no jars found to scan — the gate would have passed vacuously")

          print(f"scanned {scanned} classes across {jars} jars")
          if bad:
              for line in bad[:40]:
                  print(f"::error::{line}")
              sys.exit(f"{len(bad)} class(es) off the baseline "
                       f"(expected major {EXPECTED_MAJOR}, minor 0; minor 65535 means preview)")
          print(f"all classes at major {EXPECTED_MAJOR}, minor 0 — no preview stamp")
          EOF

      - name: Upload Surefire/Failsafe reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.spring-boot-line }}-${{ github.run_number }}
          path: '**/target/*-reports/'
          if-no-files-found: ignore
          retention-days: 7

  # The `verify` matrix proves the source compiles and tests on both lines. It cannot prove what we
  # ship: deploy.yml runs `mvn clean deploy` with no profile, so exactly one SB3-compiled jar is
  # published and ADR-028 claims it runs on SB4 as well. Source compatibility does not imply binary
  # compatibility — a call site can compile on both lines and bind to a different descriptor on each,
  # which is invisible to a per-line build and fatal at runtime. ADR-067 decides that the artefact stays
  # single and that this property is enforced rather than assumed; this job is that enforcement.
  binary-neutrality:
    name: ADR-067 binary neutrality (one jar, two lines)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PACKAGES_READ_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
      MAVEN_OPTS: '-Xmx2g'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25 (LTS baseline)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verify settings token wiring
        run: |
          if [ -z "${PACKAGES_READ_TOKEN}" ]; then
            echo "::error::PACKAGES_READ_TOKEN secret is not set. Create a PAT (classic) with read:packages scope and add it as a repository secret."
            exit 1
          fi

      - name: Compare Spring call-site descriptors across both matrix lines
        run: ./.github/scripts/spring-binary-neutrality.sh
