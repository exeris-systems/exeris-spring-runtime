# The per-repo footprint of ADR-085 §C.11. Every check it runs is defined in exeris-systems/.github;
# this file only says which gates apply here and how strictly.
#
# ONE REVIEW, ONE VERDICT, ONE PUBLISHER. The shared routine judges the pull request, its pages, its
# records, the comments in its code and what the code does; this repository's own rules reach it as
# `repo-routine`. The reviewer may not publish (ADR-087 §A.3), so the verdict is posted by
# `exeris-bot` and read by a check.
#
# THIS FILE IS ONE BLOB ON EVERY BRANCH. `claude-code-action` refuses to start when the workflow it
# runs under differs in any byte from the default branch's copy, so a branch whose copy has drifted
# gets no review at all. Anything a single branch needs goes in a workflow file of its own.
name: guardrails
on:
  pull_request:
    # labeled/unlabeled matter: a review is asked for by applying `needs-review`, a person's review
    # is recorded by applying `human-reviewed`, and adr-conventions rule 9 requires the `adr` label
    # on a pull request that amends an ADR — adding a label after a red run has to re-run the gate.
    #
    # `closed` is for the judge job: the judgement of ADR-087 §C.16, reading what the human did with
    # the review once there is a history to read.
    types: [opened, edited, synchronize, ready_for_review, labeled, unlabeled, closed]
concurrency:
  group: guardrails-${{ github.event.pull_request.number }}
  # Not `true`. Publication removes the review label, and that removal is an `unlabeled` event whose
  # run would cancel the run still publishing. Bot-triggered runs queue instead of cancelling; human
  # pushes still collapse.
  cancel-in-progress: ${{ github.event.action != 'closed' && !endsWith(github.actor, '[bot]') }}
# A called workflow can only NARROW what the caller grants, never raise it, so this block is the
# union of what every called workflow declares.
permissions:
  contents: read
  pull-requests: read
  issues: read
  id-token: write
  actions: read

jobs:
  docs:
    if: ${{ github.event.action != 'closed' }}
    uses: exeris-systems/.github/.github/workflows/docs-lint.yml@main
    with:
      # ramp, not strict: in ramp the gate fails only on files the pull request touches, so a pull
      # request is answerable for what it edits and not for a backlog it did not create. Flip to
      # strict when the frontmatter backfill has landed across the repository.
      mode: ramp
      section-check: false

  commits:
    if: ${{ github.event.action != 'closed' }}
    uses: exeris-systems/.github/.github/workflows/commit-lint.yml@main

  pr-body:
    if: ${{ github.event.action != 'closed' }}
    uses: exeris-systems/.github/.github/workflows/pr-body-check.yml@main

  # ADR-085 §F.21: Javadoc gate running doclint and Checkstyle in diff-modules mode over changed
  # files across the 8 runtime modules.
  javadoc:
    if: ${{ github.event.action != 'closed' }}
    uses: exeris-systems/.github/.github/workflows/javadoc-gate.yml@main
    with:
      diff-modules: exeris-spring-boot-autoconfigure,exeris-spring-runtime-web,exeris-spring-runtime-tx,exeris-spring-runtime-data,exeris-spring-runtime-actuator,exeris-spring-runtime-events,exeris-spring-runtime-flow,exeris-spring-runtime-graph

  # The review of ADR-085 §J.33, published under the organisation's identity by ADR-087 §B.
  docs-review:
    needs: [docs, commits, pr-body, javadoc]
    if: ${{ github.event.action != 'closed' && always() }}
    uses: exeris-systems/.github/.github/workflows/docs-review.yml@main
    with:
      publish: true
      l1-results: >-
        {"docs-lint": "${{ needs.docs.result }}",
         "commit-lint": "${{ needs.commits.result }}",
         "pr-body-check": "${{ needs.pr-body.result }}",
         "javadoc-gate": "${{ needs.javadoc.result }}"}
      mandatory-gates: "docs-lint,commit-lint,pr-body-check,javadoc-gate"
      repo-routine: docs/repo-review-rules.md
      repo-checks: >-
        pip install --quiet pyyaml;
        rc=0;
        bash tools/hook-deny-check/hook-deny-check.sh || rc=1;
        bash tools/eval-consistency-check/eval-consistency-check.sh || rc=1;
        exit $rc
      review-in-parts: true
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      exeris_bot_app_id: ${{ secrets.EXERIS_BOT_APP_ID }}
      exeris_bot_private_key: ${{ secrets.EXERIS_BOT_PRIVATE_KEY }}

  judge:
    if: ${{ github.event.action == 'closed' }}
    uses: exeris-systems/.github/.github/workflows/judge-review.yml@main
    secrets:
      exeris_bot_app_id: ${{ secrets.EXERIS_BOT_APP_ID }}
      exeris_bot_private_key: ${{ secrets.EXERIS_BOT_PRIVATE_KEY }}
