version: 2

# Actions are pinned by commit SHA (OpenSSF Scorecard "Pinned-Dependencies"), which makes them
# immune to a moved tag but also invisible to a human reading the file. Dependabot keeps it current,
# rewriting the SHA and the trailing comment together.
#
# Only the actions ecosystem is enabled. Maven dependency bumps land through milestone flow.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(actions)"
    labels:
      - dependencies
    groups:
      github-owned:
        patterns:
          - "actions/*"
          - "github/*"
